name: Lighthouse

on:
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Lighthouse CI on built pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Build needs these to type-check, doesn't need real values.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npx next build

      - name: Start server
        run: |
          npm run start &
          # Wait for the server to respond
          for i in {1..30}; do
            if curl -fs http://localhost:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Server failed to start"; exit 1

      - name: Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/pricing
            http://localhost:3000/privacy
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.github/lighthouserc.json
