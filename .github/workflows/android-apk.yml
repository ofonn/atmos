name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        working-directory: .
        env:
          HAS_BASE: ${{ secrets.ATMOS_API_BASE != '' }}
          HAS_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER != '' }}
        run: |
          if [ "$HAS_BASE" != "true" ] || [ "$HAS_PROJECT" != "true" ]; then
            echo "::error::Missing repo secret(s). Add ATMOS_API_BASE and GOOGLE_CLOUD_PROJECT_NUMBER in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Cache Dart pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            mobile/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze
        continue-on-error: true

      - name: Build split APKs (per-ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=ATMOS_API_BASE=${{ secrets.ATMOS_API_BASE }} \
            --dart-define=GOOGLE_CLOUD_PROJECT_NUMBER=${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}

      - name: Build universal APK
        run: |
          flutter build apk --release \
            --dart-define=ATMOS_API_BASE=${{ secrets.ATMOS_API_BASE }} \
            --dart-define=GOOGLE_CLOUD_PROJECT_NUMBER=${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}

      - name: List APK outputs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: atmos-apks-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
